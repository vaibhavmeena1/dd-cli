name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher-core:
    name: Launcher core checks
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Verify Apple Silicon runner
        run: test "$(uname -s)-$(uname -m)" = "Darwin-arm64"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: bun run check

      - name: Test launcher and installer
        run: bun test

      - name: Check installer shell syntax
        run: sh -n install.sh

      - name: Compile development binary
        run: bun run build

      - name: Smoke-test compiled binary
        run: |
          test "$(./dist/ddcli --version)" = "0.1.0-dev"
          ./dist/ddcli harnesses
          test "$(lipo -archs ./dist/ddcli)" = "arm64"
